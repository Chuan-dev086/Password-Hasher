<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Hash Generator & Verifier</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="card">
      <h2>Generate Hash</h2>
      <input
        type="text"
        id="passwordInput"
        placeholder="Enter plain password"
      />
      <button onclick="handleHash()">Generate Hash</button>
      <div class="result-box" id="hashResult">Hash result will appear here</div>
      <button class="copy-btn" onclick="copyHash()">Copy Hash</button>
    </div>

    <div class="card">
      <h2>Verify Password</h2>
      <input
        type="text"
        id="verifyPasswordInput"
        placeholder="Enter plain password"
      />
      <input
        type="text"
        id="verifyHashInput"
        placeholder="Enter hash to test against"
      />
      <button onclick="handleVerify()">Verify Match</button>
      <div class="result-box" id="verifyResult">
        Verification result will appear here
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
